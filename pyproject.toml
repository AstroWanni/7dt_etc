[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "seventdt"
version = "1.0.0"
description = "Exposure time calculator for 7DT with an empirical noise model (point and extended sources)"
authors = [{ name = "GWUniverse @ Seoul National University" }]
requires-python = ">=3.10"
dependencies = ["numpy", "astropy", "astroplan", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["seventdt*"]

[tool.setuptools.package-data]
"seventdt.models" = ["*.json"]
